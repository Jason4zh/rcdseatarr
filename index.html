<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>红楼梦·第四十回｜凤姐设席 · 三维复原</title>
<style>
  :root{
    --gold:#d9b86c; --gold-d:#a8863f; --red:#8c2b2b; --red-l:#d2604f;
    --paper:#f0e6cf; --ink:#1a1410; --muted:#a4936f; --panel:rgba(22,17,12,.88);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0b08;
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:#e8ddc8;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}

  /* ---------- 加载 ---------- */
  #loading{position:fixed;inset:0;background:#0d0b08;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:99;transition:opacity .8s;}
  #loading .t{font-size:22px;letter-spacing:8px;color:var(--gold);}
  #loading .s{font-size:12px;letter-spacing:3px;color:#6e6047;margin-top:14px;}
  #loading .bar{margin-top:22px;width:220px;height:2px;background:#2a2318;overflow:hidden;}
  #loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));
    animation:ld 1.6s ease-in-out infinite;}
  @keyframes ld{0%{width:0;margin-left:0}50%{width:70%;margin-left:15%}100%{width:0;margin-left:100%}}

  /* ---------- 通用面板 ---------- */
  .pnl{position:fixed;background:var(--panel);border:1px solid #4a3d2a;border-radius:10px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 28px rgba(0,0,0,.6);}

  /* 标题 */
  #title{left:14px;top:14px;padding:14px 20px;max-width:min(70vw,420px);}
  #title h1{font-size:18px;letter-spacing:4px;color:var(--gold);font-weight:600;}
  #title h1 em{font-style:normal;color:var(--red-l);}
  #title .sub{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:6px;line-height:1.6;}
  #title .hint{font-size:10.5px;color:#7d6c47;margin-top:8px;border-top:1px dashed #3d3323;padding-top:7px;line-height:1.7;}

  /* 图例 */
  #legend{left:14px;bottom:14px;padding:12px 16px;font-size:11.5px;line-height:2;color:#c4b89e;}
  #legend b{color:var(--gold);letter-spacing:2px;display:block;margin-bottom:4px;font-size:11px;}
  #legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;vertical-align:-1px;}

  /* 信息卡 */
  #info{right:14px;top:14px;width:min(88vw,300px);padding:16px 18px;max-height:52vh;overflow:auto;}
  #info h3{font-size:16px;color:var(--gold);letter-spacing:2px;margin-bottom:4px;}
  #info .tag{font-size:11px;color:var(--red-l);letter-spacing:2px;margin-bottom:9px;}
  #info p{font-size:12.5px;line-height:1.85;color:#cdc1a7;}
  #info .empty{color:var(--muted);font-size:12.5px;line-height:1.9;}

  /* 控制 */
  #ctrl{right:14px;bottom:14px;padding:12px 14px;width:min(88vw,300px);}
  #ctrl .row{display:flex;flex-wrap:wrap;gap:6px;}
  #ctrl .lb{font-size:11px;letter-spacing:2px;color:var(--gold);margin:0 0 7px;}
  #ctrl .lb.sp{margin-top:11px;}
  .btn{font-family:inherit;font-size:11.5px;letter-spacing:1px;color:#d8ccb2;background:#2a2318;
    border:1px solid #4a3d2a;border-radius:6px;padding:5px 10px;cursor:pointer;transition:.15s;}
  .btn:hover{background:#3a2f1c;border-color:var(--gold);color:var(--gold);}
  .btn.on{background:var(--red);border-color:var(--red-l);color:#f6ece0;}

  /* 底部提示 */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:8px 20px;
    font-size:12px;letter-spacing:2px;color:var(--gold);background:var(--panel);
    border:1px solid #4a3d2a;border-radius:20px;opacity:0;transition:.4s;pointer-events:none;z-index:60;}
  #toast.show{opacity:1;}

  @media (max-width:760px){
    #title{max-width:60vw;padding:10px 14px;}
    #title h1{font-size:14px;letter-spacing:2px;}
    #title .hint{display:none;}
    #legend{display:none;}
    #info{width:min(92vw,280px);top:auto;bottom:14px;right:14px;max-height:32vh;}
    #ctrl{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="t">大 观 园 · 设 席</div>
  <div class="s">红楼梦第四十回 · 三维复原</div>
  <div class="bar"><i></i></div>
</div>

<div id="title" class="pnl">
  <h1>凤姐<em>设席</em>·三维复原</h1>
  <div class="sub">红楼梦 第四十回　史太君两宴大观园</div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 双指平移 · 点击座位查看考释</div>
</div>

<div id="legend" class="pnl">
  <b>图　例</b>
  <div><i style="background:#8c2f2a"></i>榻（上首 · 二榻四几）</div>
  <div><i style="background:#a8863f"></i>一椅两几（王夫人）</div>
  <div><i style="background:#5a4a30"></i>一椅一几（常席）</div>
  <div><i style="background:#3f6b58"></i>槛内纱厨外（李纨·凤姐）</div>
</div>

<div id="info" class="pnl">
  <div class="empty">
    ← 点击场景中的任一座位<br>查看其身份、座次依据与器物配置。
  </div>
</div>

<div id="ctrl" class="pnl">
  <div class="lb">视　角</div>
  <div class="row">
    <button class="btn" data-view="bird">全　景</button>
    <button class="btn" data-view="top">俯　视</button>
    <button class="btn" data-view="north">上首·二榻</button>
    <button class="btn" data-view="south">下面·王夫人</button>
    <button class="btn" data-view="west">西边·诸钗</button>
    <button class="btn" data-view="east">东边·刘姥姥</button>
    <button class="btn" data-view="ji">槛内·纱厨外</button>
  </div>
  <div class="lb sp">图　层</div>
  <div class="row">
    <button class="btn on" id="tLabel">名牌</button>
    <button class="btn on" id="tVessel">壶·杯</button>
    <button class="btn" id="tScreen">纱厨·槛</button>
    <button class="btn on" id="tRoof">屋顶</button>
    <button class="btn" id="tSpin">自动旋转</button>
    <button class="btn" id="tNight">夜　宴</button>
  </div>
</div>

<div id="toast"></div>

<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>
<script>
/* ================================================================
   红楼梦·第四十回 凤姐设席 —— 三维复原
   坐标约定： +X = 东， -X = 西， +Z = 南（观者侧）， -Z = 北（上首）
   单位：1 ≈ 0.32m（一尺左右）
   ================================================================ */
(function(){
'use strict';

/* ---------------- 基础 ---------------- */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1318);
scene.fog = new THREE.Fog(0x0f1318, 46, 108);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 500);
camera.position.set(20, 17, 27);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
app.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(0, 1.2, 1.0);
controls.maxPolarAngle = Math.PI * 0.492;
controls.minDistance = 7;
controls.maxDistance = 78;

/* ---------------- 画布纹理工具 ---------------- */
function canvasTex(w, h, draw, rx, ry){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx||1, ry||1);
  t.anisotropy = 8;
  if (renderer.capabilities) t.encoding = THREE.sRGBEncoding;
  return t;
}
function rnd(a,b){ return a + Math.random()*(b-a); }

/* 地板（金砖/木地板） */
const texFloor = canvasTex(512, 512, (g,w,h)=>{
  g.fillStyle = '#4a3a2a'; g.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){
    g.fillStyle = i%2 ? '#523f2d' : '#493825';
    g.fillRect(0, i*h/8, w, h/8-2);
    g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, i*h/8); g.lineTo(w, i*h/8); g.stroke();
  }
  for(let i=0;i<160;i++){
    g.strokeStyle = 'rgba(0,0,0,'+rnd(.02,.09)+')';
    g.beginPath();
    const y = rnd(0,h), x = rnd(0,w);
    g.moveTo(x,y); g.lineTo(x+rnd(20,90), y+rnd(-3,3)); g.stroke();
  }
}, 6, 6);

/* 锦裀（织锦坐褥） */
const texBrocade = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle = '#6e2320'; g.fillRect(0,0,w,h);
  g.strokeStyle = '#c9a227'; g.lineWidth = 2;
  for(let i=0;i<8;i++){
    g.save(); g.translate(i*32, 0); g.rotate(0);
    g.beginPath();
    for(let j=0;j<=8;j++){ g.lineTo(j*16, (j%2?32:0)); }
    g.stroke(); g.restore();
  }
  g.strokeRect(4,4,w-8,h-8);
  g.fillStyle = '#a8863f';
  for(let x=0;x<8;x++) for(let y=0;y<8;y++){ g.beginPath(); g.arc(x*32+16, y*32+16, 4, 0, 6.3); g.fill(); }
}, 2, 1.4);

/* 蓉簟（竹席） */
const texMat = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle = '#c8a86a'; g.fillRect(0,0,w,h);
  for(let i=0;i<32;i++){
    g.fillStyle = i%2 ? '#bfa059' : '#d2b478';
    g.fillRect(0, i*8, w, 8);
  }
  g.strokeStyle = 'rgba(120,90,40,.5)'; g.lineWidth = 1;
  for(let i=0;i<32;i++){ g.beginPath(); g.moveTo(0,i*8); g.lineTo(w,i*8); g.stroke(); }
  for(let i=0;i<8;i++){ g.beginPath(); g.moveTo(i*32,0); g.lineTo(i*32,h); g.stroke(); }
}, 3, 2);

/* 雕漆（剔红·缠枝纹） */
const texDiaoqi = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle = '#8c2018'; g.fillRect(0,0,w,h);
  g.strokeStyle = '#e0b64a'; g.lineWidth = 3;
  g.beginPath();
  for(let i=0;i<=64;i++){
    const t = i/64*Math.PI*2;
    const r = 70 + 26*Math.cos(6*t);
    const x = 128 + Math.cos(t)*r, y = 128 + Math.sin(t)*r;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.stroke();
  g.strokeStyle = '#c8973a'; g.lineWidth = 2;
  g.beginPath(); g.arc(128,128,110,0,6.3); g.stroke();
  g.beginPath(); g.arc(128,128,30,0,6.3); g.stroke();
}, 1, 1);

/* 地毯 */
const texCarpet = canvasTex(512, 256, (g,w,h)=>{
  g.fillStyle = '#7a2620'; g.fillRect(0,0,w,h);
  g.strokeStyle = '#c9a227'; g.lineWidth = 6;
  g.strokeRect(12,12,w-24,h-24);
  g.strokeStyle = '#a8863f'; g.lineWidth = 3;
  g.strokeRect(30,30,w-60,h-60);
  g.fillStyle = 'rgba(201,162,39,.55)';
  for(let x=0;x<10;x++) for(let y=0;y<5;y++){
    const cx = 60 + x*44, cy = 52 + y*40;
    g.save(); g.translate(cx,cy); g.rotate(Math.PI/4);
    g.fillRect(-9,-9,18,18); g.restore();
  }
}, 1, 1);

/* 纱（窗纱 · 方孔） */
const texGauze = canvasTex(128, 128, (g,w,h)=>{
  g.clearRect(0,0,w,h);
  g.strokeStyle = 'rgba(214,222,206,.42)'; g.lineWidth = 1;
  for(let i=0;i<=16;i++){
    g.beginPath(); g.moveTo(i*8,0); g.lineTo(i*8,h); g.stroke();
    g.beginPath(); g.moveTo(0,i*8); g.lineTo(w,i*8); g.stroke();
  }
}, 6, 6);

/* 瓦 */
const texTile = canvasTex(128, 128, (g,w,h)=>{
  g.fillStyle = '#2f3b36'; g.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){
    g.fillStyle = i%2 ? '#333f39' : '#2a3531';
    g.beginPath(); g.arc(i*16+8, 8, 10, Math.PI, 0); g.fill();
    g.fillStyle = i%2 ? '#374438' : '#2d3934';
    g.beginPath(); g.arc(i*16+8, h-8, 10, 0, Math.PI); g.fill();
  }
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1;
  for(let i=0;i<=8;i++){ g.beginPath(); g.moveTo(i*16,0); g.lineTo(i*16,h); g.stroke(); }
}, 8, 6);

/* ---------------- 材质库 ---------------- */
const M = {
  floor:   new THREE.MeshStandardMaterial({map:texFloor, roughness:.82, metalness:.04}),
  carpet:  new THREE.MeshStandardMaterial({map:texCarpet, roughness:.95}),
  wood:    new THREE.MeshStandardMaterial({color:0x5a3a26, roughness:.62, metalness:.05}),
  woodD:   new THREE.MeshStandardMaterial({color:0x3d2718, roughness:.7}),
  hongmu:  new THREE.MeshStandardMaterial({color:0x6d3a22, roughness:.5, metalness:.06}),
  diaoqi:  new THREE.MeshStandardMaterial({map:texDiaoqi, color:0xffffff, roughness:.34, metalness:.16}),
  gold:    new THREE.MeshStandardMaterial({color:0xc9a227, roughness:.28, metalness:.88}),
  bronze:  new THREE.MeshStandardMaterial({color:0x8c6c3c, roughness:.38, metalness:.82}),
  wuxin:   new THREE.MeshStandardMaterial({color:0x30303a, roughness:.3, metalness:.92}),
  porcelain:new THREE.MeshStandardMaterial({color:0xf4eee2, roughness:.14, metalness:.04}),
  enamel:  new THREE.MeshStandardMaterial({color:0x1f9a94, roughness:.18, metalness:.12}),
  enamel2: new THREE.MeshStandardMaterial({color:0xc0392b, roughness:.18, metalness:.12}),
  enamel3: new THREE.MeshStandardMaterial({color:0x2f6fb0, roughness:.18, metalness:.12}),
  brocade: new THREE.MeshStandardMaterial({map:texBrocade, roughness:.85}),
  mat:     new THREE.MeshStandardMaterial({map:texMat, roughness:.9}),
  stone:   new THREE.MeshStandardMaterial({color:0x8d887b, roughness:.92}),
  tile:    new THREE.MeshStandardMaterial({map:texTile, roughness:.55, metalness:.15, side:THREE.DoubleSide}),
  column:  new THREE.MeshStandardMaterial({color:0x8f2f28, roughness:.45, metalness:.05}),
  beam:    new THREE.MeshStandardMaterial({color:0x2e5a4a, roughness:.6}),
  gauze:   new THREE.MeshStandardMaterial({map:texGauze, transparent:true, opacity:.5, side:THREE.DoubleSide,
                                           roughness:1, depthWrite:false}),
  jade:    new THREE.MeshStandardMaterial({color:0x7fae95, roughness:.2, metalness:.1}),
  ink:     new THREE.MeshStandardMaterial({color:0x1b1b1e, roughness:.6}),
  paper:   new THREE.MeshStandardMaterial({color:0xf0e6cf, roughness:.85}),
  lotusL:  new THREE.MeshStandardMaterial({color:0x3f7a4a, roughness:.75, side:THREE.DoubleSide}),
  lotusF:  new THREE.MeshStandardMaterial({color:0xe8a0b4, roughness:.6, side:THREE.DoubleSide}),
  water:   new THREE.MeshStandardMaterial({color:0x22454f, roughness:.14, metalness:.6,
                                           transparent:true, opacity:.94}),
  leaf:    new THREE.MeshStandardMaterial({color:0x2f5f3c, roughness:.85}),
  trunk:   new THREE.MeshStandardMaterial({color:0x4a3624, roughness:.9})
};
const c = h => new THREE.Color(h);

/* ---------------- 小工具 ---------------- */
function box(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x||0, y||0, z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(rt,rb,h,mat,seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function sph(r,mat,seg){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg||20, (seg||20)/2), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* 花瓣状轮廓 */
function lobedShape(n, R, amp, phase){
  const s = new THREE.Shape();
  const N = n*22, pts = [];
  for(let i=0;i<=N;i++){
    const t = i/N*Math.PI*2;
    const r = R + amp*Math.cos(n*t + (phase||0));
    pts.push(new THREE.Vector2(Math.cos(t)*r, Math.sin(t)*r));
  }
  s.setFromPoints(pts);
  return s;
}
function squareShape(a){
  const s = new THREE.Shape();
  s.moveTo(-a,-a); s.lineTo(a,-a); s.lineTo(a,a); s.lineTo(-a,a); s.lineTo(-a,-a);
  return s;
}
function circleShape(r){
  const s = new THREE.Shape();
  s.absarc(0,0,r,0,Math.PI*2,false);
  return s;
}
function extrude(shape, depth, bevel){
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: depth, curveSegments: 24,
    bevelEnabled: bevel!==false, bevelSize:0.018, bevelThickness:0.018, bevelSegments:2
  });
  g.rotateX(-Math.PI/2);
  return g;
}
/* 名称牌 */
function makeLabel(main, sub, accent){
  const W = 512, H = 224;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.clearRect(0,0,W,H);
  // 牌
  g.fillStyle = 'rgba(20,15,10,.86)';
  g.strokeStyle = accent || '#c9a227';
  g.lineWidth = 5;
  const r = 22;
  g.beginPath();
  g.moveTo(20+r,16); g.lineTo(W-20-r,16); g.quadraticCurveTo(W-20,16,W-20,16+r);
  g.lineTo(W-20,H-16-r); g.quadraticCurveTo(W-20,H-16,W-20-r,H-16);
  g.lineTo(20+r,H-16); g.quadraticCurveTo(20,H-16,20,H-16-r);
  g.lineTo(20,16+r); g.quadraticCurveTo(20,16,20+r,16);
  g.closePath(); g.fill(); g.stroke();
  // 顶饰
  g.fillStyle = accent || '#c9a227';
  g.beginPath(); g.arc(60, 16, 8, 0, 6.3); g.fill();
  g.beginPath(); g.arc(W-60, 16, 8, 0, 6.3); g.fill();
  // 主名
  g.fillStyle = '#f4e9d0';
  g.font = '600 100px "Noto Serif SC","Songti SC",serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(main, W/2, H/2 - 4);
  // 副名
  if(sub){
    g.fillStyle = accent || '#c9a227';
    g.font = '40px "Noto Serif SC","Songti SC",serif';
    g.fillText(sub, W/2, H - 46);
  }
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthTest:false}));
  sp.scale.set(2.5, 1.09, 1);
  sp.renderOrder = 999;
  return sp;
}

/* ================================================================
   建筑构件
   ================================================================ */
const HALL = { xMin:-9.4, xMax:9.4, zMin:-9.6, zMax:12.4, colH:4.6 };

function buildPlatform(){
  const g = new THREE.Group();
  const w = HALL.xMax-HALL.xMin+2.2, d = HALL.zMax-HALL.zMin+2.2;
  // 石台基
  const base = box(w, 1.2, d, M.stone, (HALL.xMin+HALL.xMax)/2, -0.6, (HALL.zMin+HALL.zMax)/2);
  g.add(base);
  // 台面
  const fl = box(w-0.6, 0.14, d-0.6, M.floor, (HALL.xMin+HALL.xMax)/2, 0.03, (HALL.zMin+HALL.zMax)/2);
  g.add(fl);
  // 台基压边
  const rim = box(w, 0.16, d, M.stone, (HALL.xMin+HALL.xMax)/2, -0.02, (HALL.zMin+HALL.zMax)/2);
  rim.castShadow = false; g.add(rim);
  return g;
}

/* 栏杆（卍字/回纹） */
function buildRail(x1,z1,x2,z2){
  const g = new THREE.Group();
  const len = Math.hypot(x2-x1, z2-z1);
  const ang = Math.atan2(z2-z1, x2-x1);
  const h = 0.95;
  // 望柱
  const n = Math.max(2, Math.round(len/1.6));
  for(let i=0;i<=n;i++){
    const t = i/n;
    const p = cyl(0.055,0.065,h, M.hongmu, 10);
    p.position.set(x1+(x2-x1)*t, h/2, z1+(z2-z1)*t);
    g.add(p);
    const cap = sph(0.075, M.hongmu, 10);
    cap.position.set(x1+(x2-x1)*t, h+0.05, z1+(z2-z1)*t);
    g.add(cap);
  }
  // 上下横枋
  const midX = (x1+x2)/2, midZ = (z1+z2)/2;
  const top = box(len, 0.09, 0.09, M.hongmu, midX, h-0.1, midZ);
  top.rotation.y = -ang; g.add(top);
  const bot = box(len, 0.07, 0.07, M.hongmu, midX, 0.18, midZ);
  bot.rotation.y = -ang; g.add(bot);
  // 棂条
  const cnt = Math.max(3, Math.round(len/0.34));
  for(let i=0;i<cnt;i++){
    const t = (i+0.5)/cnt;
    const px = x1+(x2-x1)*t, pz = z1+(z2-z1)*t;
    const v = box(0.035, h-0.34, 0.035, M.hongmu, px, (h-0.1+0.18)/2, pz);
    v.rotation.y = -ang; g.add(v);
  }
  return g;
}

/* 柱 + 梁 */
function buildStructure(){
  const g = new THREE.Group();
  const zs = [HALL.zMin, 1.0, HALL.zMax];
  const xs = [HALL.xMin, HALL.xMax];
  const cols = [];
  zs.forEach(z => xs.forEach(x => cols.push([x,z])));
  cols.push([-3.0, HALL.zMin], [3.0, HALL.zMin], [-3.0, HALL.zMax], [3.0, HALL.zMax]);

  cols.forEach(([x,z])=>{
    const p = cyl(0.24,0.28, HALL.colH, M.column, 16);
    p.position.set(x, HALL.colH/2, z);
    g.add(p);
    // 柱础
    const b = cyl(0.36,0.42,0.22, M.stone, 16);
    b.position.set(x, 0.11, z); g.add(b);
    // 雀替
    const q = box(0.9,0.3,0.16, M.beam, x, HALL.colH-0.5, z);
    q.castShadow = true; g.add(q);
  });
  // 额枋（横梁）
  const spanX = HALL.xMax-HALL.xMin;
  zs.forEach(z=>{
    const b = box(spanX+0.6, 0.5, 0.34, M.beam, (HALL.xMin+HALL.xMax)/2, HALL.colH-0.2, z);
    g.add(b);
    const b2 = box(spanX+0.6, 0.16, 0.42, M.gold, (HALL.xMin+HALL.xMax)/2, HALL.colH-0.48, z);
    g.add(b2);
  });
  const spanZ = HALL.zMax-HALL.zMin;
  xs.forEach(x=>{
    const b = box(0.34, 0.5, spanZ+0.6, M.beam, x, HALL.colH-0.2, (HALL.zMin+HALL.zMax)/2);
    g.add(b);
    const b2 = box(0.42, 0.16, spanZ+0.6, M.gold, x, HALL.colH-0.48, (HALL.zMin+HALL.zMax)/2);
    g.add(b2);
  });
  // 次梁
  for(let i=1;i<4;i++){
    const t = i/4;
    const z = HALL.zMin + spanZ*t;
    const b = box(spanX+0.4, 0.3, 0.24, M.beam, (HALL.xMin+HALL.xMax)/2, HALL.colH-0.05, z);
    g.add(b);
  }
  // 短柱（瓜柱）
  [[-4.7],[-1.6],[1.6],[4.7]].forEach(([x])=>{
    [-6.0, 3.0, 9.5].forEach(z=>{
      const p = box(0.22,0.6,0.22, M.beam, x, HALL.colH+0.35, z);
      g.add(p);
    });
  });
  return g;
}

/* 攒尖屋顶 */
function buildRoof(){
  const g = new THREE.Group();
  const eaveY = HALL.colH + 0.9;
  const apex = new THREE.Vector3(0, eaveY + 3.1, 1.2);
  const ox = 1.9, oz = 1.9;
  const corners = [
    new THREE.Vector3(HALL.xMin-ox, eaveY, HALL.zMin-oz),
    new THREE.Vector3(HALL.xMax+ox, eaveY, HALL.zMin-oz),
    new THREE.Vector3(HALL.xMax+ox, eaveY, HALL.zMax+oz),
    new THREE.Vector3(HALL.xMin-ox, eaveY, HALL.zMax+oz)
  ];
  const uv = [];
  const pos = [];
  const idx = [];
  corners.forEach(p => pos.push(p.x,p.y,p.z));
  pos.push(apex.x, apex.y, apex.z);
  // 四个三角面
  for(let i=0;i<4;i++){
    idx.push(i, (i+1)%4, 4);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const roof = new THREE.Mesh(geo, M.tile);
  roof.castShadow = true; roof.receiveShadow = true;
  g.add(roof);

  // 檐口（一圈檐板 + 飞檐翘角）
  const eave = new THREE.Group();
  for(let i=0;i<4;i++){
    const a = corners[i], b = corners[(i+1)%4];
    const len = a.distanceTo(b);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.34, 0.5), M.beam);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.position.y = eaveY + 0.1;
    m.rotation.y = -Math.atan2(b.z-a.z, b.x-a.x);
    m.castShadow = true;
    eave.add(m);
  }
  g.add(eave);

  // 翘角
  corners.forEach(p=>{
    const t = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.5, 8), M.beam);
    const toCenter = new THREE.Vector3(0,0,1.2).sub(p).setY(0).normalize();
    const out = toCenter.clone().negate();
    t.position.set(p.x + out.x*0.55, eaveY + 0.45, p.z + out.z*0.55);
    t.rotation.z = -out.x * 0.75;
    t.rotation.x = out.z * 0.75;
    t.castShadow = true;
    g.add(t);
    const tip = sph(0.2, M.gold, 12);
    tip.position.set(p.x + out.x*1.25, eaveY + 1.15, p.z + out.z*1.25);
    g.add(tip);
  });

  // 宝顶
  const fin = new THREE.Group();
  const f1 = cyl(0.34,0.46,0.6, M.beam, 16); f1.position.y = 0.3; fin.add(f1);
  const f2 = sph(0.42, M.gold, 18); f2.position.y = 0.85; fin.add(f2);
  const f3 = cyl(0.1,0.1,1.0, M.gold, 10); f3.position.y = 1.6; fin.add(f3);
  const f4 = sph(0.24, M.gold, 14); f4.position.y = 2.2; fin.add(f4);
  fin.position.copy(apex);
  g.add(fin);
  return g;
}

function buildThreshold(){
  const g = new THREE.Group();

    g.add(p);
  });

  const cz = 9.3;

  const post = (x)=>{ const p = box(0.22,3.4,0.22, M.hongmu, x, 1.7, cz); frame.add(p); };
  [-6.6,-3.3,0,3.3,6.6].forEach(post);

  // 纱面
  const gauze = new THREE.Mesh(new THREE.PlaneGeometry(13.2, 3.1), M.gauze);
  gauze.position.set(0, 1.72, cz);
  frame.add(gauze);
  // 纱上的隐纹
  const pat = canvasTex(256,128,(g2,w,h)=>{
    g2.clearRect(0,0,w,h);
    g2.strokeStyle='rgba(226,213,180,.5)'; g2.lineWidth=2;
    for(let i=0;i<7;i++){
      const x = 20+i*36;
      g2.beginPath();
      for(let j=0;j<=8;j++) g2.lineTo(x + 16*Math.sin(j/8*6.28), 16+j*14);
      g2.stroke();
    }
  },1,1);
  const gauze2 = new THREE.Mesh(new THREE.PlaneGeometry(13.2,3.1),
    new THREE.MeshStandardMaterial({map:pat, transparent:true, opacity:.5, side:THREE.DoubleSide, depthWrite:false}));
  gauze2.position.set(0,1.72, cz+0.01);
  frame.add(gauze2);
  g.add(frame);
  return g;
}

/* —— 十锦珐琅杯 —— */
function makeBei(colorIdx){
  const g = new THREE.Group();
  const mats = [M.enamel, M.enamel2, M.enamel3];
  const mat = mats[colorIdx % 3];
  const prof = [
    new THREE.Vector2(0.001,0.00), new THREE.Vector2(0.035,0.002),
    new THREE.Vector2(0.042,0.012), new THREE.Vector2(0.048,0.05),
    new THREE.Vector2(0.055,0.085), new THREE.Vector2(0.058,0.10)
  ];
  const cup = new THREE.Mesh(new THREE.LatheGeometry(prof, 22), mat);
  cup.material.side = THREE.DoubleSide;
  cup.castShadow = true; g.add(cup);
  // 口沿金边
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.058,0.005,6,24), M.gold);
  rim.rotation.x = Math.PI/2; rim.position.y = 0.10; g.add(rim);
  // 内壁茶色
  const tea = cyl(0.05,0.045,0.002, new THREE.MeshStandardMaterial({color:0x6b4a24, roughness:.25}), 20);
  tea.position.y = 0.082; g.add(tea);
  // 圈足
  const ft = cyl(0.036,0.038,0.008, M.gold, 16); ft.position.y = 0.004; g.add(ft);
  // 十锦纹
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    const dot = sph(0.008, i%2?M.gold:M.enamel2, 8);
    dot.position.set(Math.cos(a)*0.052, 0.055, Math.sin(a)*0.052);
    g.add(dot);
  }
  return g;
}

/* —— 官帽椅 —— */
function makeChair(mat){
  const g = new THREE.Group();
  const m = mat || M.hongmu;
  const SH = 0.55, W = 0.62, D = 0.58;
  // 座面
  g.add(box(W, 0.07, D, m, 0, SH, 0));
  // 束腰
  g.add(box(W-0.08, 0.05, D-0.08, M.woodD, 0, SH-0.06, 0));
  // 四腿（侧脚收分）
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sz])=>{
    const l = cyl(0.035,0.045,SH-0.09, m, 10);
    l.position.set(sx*(W/2-0.05), (SH-0.09)/2, sz*(D/2-0.05));
    l.rotation.x = sz*0.03; l.rotation.z = -sx*0.03;
    g.add(l);
  });
  // 管脚枨
  g.add(box(W-0.16, 0.05, 0.05, m, 0, 0.18, D/2-0.07));
  g.add(box(W-0.16, 0.05, 0.05, m, 0, 0.30, -D/2+0.07));
  g.add(box(0.05, 0.05, D-0.16, m, W/2-0.07, 0.24, 0));
  g.add(box(0.05, 0.05, D-0.16, m, -W/2+0.07, 0.24, 0));
  // 靠背（后腿上延）
  const bh = 1.16;
  [[-1],[1]].forEach(([sx])=>{
    const p = cyl(0.032,0.04, bh-SH, m, 10);
    p.position.set(sx*(W/2-0.05), SH + (bh-SH)/2, -D/2+0.05);
    p.rotation.z = -sx*0.015;
    g.add(p);
  });
  // 搭脑
  g.add(box(W+0.16, 0.08, 0.09, m, 0, bh, -D/2+0.05));
  // 联帮棍（S形立柱）
  [[-1],[1]].forEach(([sx])=>{
    const s = cyl(0.026,0.03, 0.5, m, 8);
    s.position.set(sx*(W/2-0.12), SH+0.28, -D/2+0.09);
    s.rotation.x = 0.12 * sx;
    g.add(s);
  });
  // 靠背板 / 雕花心板
  const splat = box(0.33, 0.52, 0.045, M.diaoqi, 0, SH+0.38, -D/2+0.06);
  g.add(splat);
  const sq = box(0.20,0.20,0.02, M.gold, 0, SH+0.38, -D/2+0.03);
  sq.rotation.z = Math.PI/4; g.add(sq);
  // 扶手
  [[-1],[1]].forEach(([sx])=>{
    const a = box(0.52, 0.06, 0.07, m, sx*(W/2-0.05+0.05), SH+0.30, 0.02);
    a.rotation.y = -sx*0.42;
    g.add(a);
  });
  // 坐垫（锦）
  g.add(box(W-0.10, 0.07, D-0.10, M.brocade, 0, SH+0.07, 0));
  return g;
}

  const leafGeo = new THREE.CircleGeometry(0.62, 18);
  const flowerPetal = new THREE.ConeGeometry(0.10, 0.34, 6, 1, true);
  for(let i=0;i<130;i++){
    const a = Math.random()*Math.PI*2;
    const r = 13 + Math.pow(Math.random(),0.6)*46;
    const x = Math.cos(a)*r, z = Math.sin(a)*r + 1.0;
    // 避免落在台上
    if(x > HALL.xMin-3 && x < HALL.xMax+3 && z > HALL.zMin-3 && z < HALL.zMax+3) continue;
    const leaf = new THREE.Mesh(leafGeo, M.lotusL);
    leaf.rotation.x = -Math.PI/2;
    leaf.rotation.z = Math.random()*3.14;
    leaf.position.set(x, -1.22, z);
    leaf.receiveShadow = true;
    g.add(leaf);
    if(Math.random() < 0.24){
      const fl = new THREE.Group();
      for(let p=0;p<7;p++){
        const pa = p/7*Math.PI*2;
        const pet = new THREE.Mesh(flowerPetal, M.lotusF);

    for(let i=0;i<6;i++){
      const x = HALL.xMin - 2.2 - i*0.0;
      const z = -3 + i*3.6;
      const post = cyl(0.14,0.16,3.4, M.column, 10);
      post.position.set(x, 0.45, z);
      p.add(post);
    }
    const roof = box(2.6, 0.2, 21, M.tile, HALL.xMin-1.2, 3.9, 5.0);
    p.add(roof);
    p.position.y = -1.25;
    return p;
  })();

  // 远山剪影
  for(let i=0;i<9;i++){
    const h = rnd(9, 22);
    const m = new THREE.Mesh(new THREE.ConeGeometry(rnd(9,18), h, 5),
      new THREE.MeshStandardMaterial({color:0x1c2a2c, roughness:1}));
    const a = -0.9 + i*0.24;
    m.position.set(Math.cos(a)*78, h/2 - 4, Math.sin(a)*78 - 6);
    m.rotation.y = Math.random()*3;
    g.add(m);
  }
  return g;
}
world.add(buildEnvironment());

/* ================================================================
   灯光
   ================================================================ */
const hemi = new THREE.HemisphereLight(0xa8c4d8, 0x3a2e20, 0.62);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe9c4, 1.35);
sun.position.set(26, 30, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
const sc = 26;
sun.shadow.camera.left = -sc; sun.shadow.camera.right = sc;
sun.shadow.camera.top = sc; sun.shadow.camera.bottom = -sc;
sun.shadow.bias = -0.0006;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x87a6d8, 0.35);
fill.position.set(-20, 14, -18);
scene.add(fill);

const warm = new THREE.PointLight(0xffb070, 0.5, 34, 2);
warm.position.set(0, 4.0, 3.0);
scene.add(warm);

/* ================================================================
   交互
   ================================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const infoEl = document.getElementById('info');
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(t){
  toastEl.textContent = t;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1500);
}

let downPos = null;
renderer.domElement.addEventListener('pointerdown', e=>{ downPos = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos = null;
  if(moved > 6) return;

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickable, false);
  if(hit.length){
    const s = hit[0].object.userData.seat;
    showInfo(s);
    controls.target.set(s.pos[0], 1.0, s.pos[2]);
  }
});

function showInfo(s){
  infoEl.innerHTML =
    '<h3>'+s.name+'</h3>' +
    '<div class="tag">'+s.tag+'</div>' +
    '<p>'+s.desc+'</p>' +
    '<p style="margin-top:10px;color:#8d8069;font-size:11.5px;border-top:1px dashed #3d3323;padding-top:8px;">'+
    '原文对应：「'+s.name+'」之位在'+s.tag.replace(/·/g,'／')+'。</p>';
}

/* 视角 */
const VIEWS = {
  bird:  {p:[24, 20, 30], t:[0, 1.2, 1.2]},
  top:   {p:[0.01, 42, 2.0], t:[0, 0, 1.8]},
  north: {p:[0, 4.2, -0.5], t:[-3.6, 1.2, -6.6]},
  south: {p:[0, 4.6, 1.0], t:[0, 1.1, 6.9]},
  west:  {p:[-0.5, 4.6, -4.0], t:[-5.7, 1.0, 0.5]},
  east:  {p:[0.5, 4.2, -0.5], t:[5.7, 1.0, -3.6]},
  ji:    {p:[0, 5.0, 4.0], t:[0, 0.8, 10.4]}
};
function tweenTo(from, to, t, dur){
  const start = performance.now(), a = from.clone(), b = to.clone();
  (function step(){
    const k = Math.min(1, (performance.now()-start)/dur);
    const e = k<0.5 ? 2*k*k : -1+(4-2*k)*k;
    from.lerpVectors(a, b, e);
    if(k < 1) requestAnimationFrame(step);
  })();
}
document.querySelectorAll('[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const v = VIEWS[btn.dataset.view];
    camera.position.set(v.p[0], v.p[1], v.p[2]);
    controls.target.set(v.t[0], v.t[1], v.t[2]);
    controls.update();
    toast('视角：' + btn.textContent.replace(/\s/g,''));
  });
});

/* 图层开关 */
const state = {label:true, vessel:true, screen:true, roof:true, spin:false, night:false};
function syncBtn(id, on){ document.getElementById(id).classList.toggle('on', on); }

document.getElementById('tLabel').onclick = e=>{
  state.label = !state.label; labelGroup.visible = state.label;
  syncBtn('tLabel', state.label); toast(state.label?'显示名牌':'隐藏名牌');
};
document.getElementById('tVessel').onclick = e=>{
  state.vessel = !state.vessel; vesselGroup.visible = state.vessel;
  syncBtn('tVessel', state.vessel); toast(state.vessel?'显示壶·杯·攒盒':'隐藏壶·杯');
};
document.getElementById('tScreen').onclick = e=>{
  state.screen = !state.screen; gThresh.visible = state.screen;
  syncBtn('tScreen', state.screen); toast(state.screen?'显示三层槛·二层纱厨':'隐藏槛·纱厨');
};
document.getElementById('tRoof').onclick = e=>{
  state.roof = !state.roof; gRoof.visible = state.roof;
  syncBtn('tRoof', state.roof); toast(state.roof?'显示屋顶':'揭开屋顶（鸟瞰席面）');
};
document.getElementById('tSpin').onclick = e=>{
  state.spin = !state.spin; controls.autoRotate = state.spin; controls.autoRotateSpeed = 0.7;
  syncBtn('tSpin', state.spin); toast(state.spin?'自动旋转':'停止旋转');
};
document.getElementById('tNight').onclick = e=>{
  state.night = !state.night;
  syncBtn('tNight', state.night);
  if(state.night){
    scene.background = new THREE.Color(0x070a10);
    scene.fog = new THREE.Fog(0x070a10, 34, 92);
    hemi.intensity = 0.16; sun.intensity = 0.10; fill.intensity = 0.10; warm.intensity = 1.0;
    lanternLights.forEach(l=>{ l.intensity = 1.25; l.distance = 20; });
    renderer.toneMappingExposure = 1.25;
    toast('夜宴：烛影摇红');
  } else {
    scene.background = new THREE.Color(0x0f1318);
    scene.fog = new THREE.Fog(0x0f1318, 46, 108);
    hemi.intensity = 0.62; sun.intensity = 1.35; fill.intensity = 0.35; warm.intensity = 0.5;
    lanternLights.forEach(l=>{ l.intensity = 0.75; l.distance = 16; });
    renderer.toneMappingExposure = 1.02;
    toast('白昼：秋光潋滟');
  }
};

/* 匾额切换（藕香榭 / 缀锦阁） */
(function(){
  const el = document.createElement('div');
  el.className = 'pnl';
  el.style.cssText = 'left:50%;bottom:14px;transform:translateX(-50%);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:20;';
  el.innerHTML = '<span style="font-size:11px;color:#a4936f;letter-spacing:2px;padding:0 4px;">地点匾额</span>' +
    '<button class="btn on" id="pl1">藕香榭</button><button class="btn" id="pl2">缀锦阁</button>';
  document.body.appendChild(el);
  const swap = (txt, a, b)=>{
    const gp = world.userData.plaqueGroup;
    gp.remove(gp.userData.plaque);
    const p = makePlaque(txt);
    p.position.set(0, 3.85, -8.6 + 0.22);
    gp.add(p); gp.userData.plaque = p;
    document.getElementById(a).classList.add('on');
    document.getElementById(b).classList.remove('on');
    toast('匾额：' + txt + '（两说并存）');
  };
  document.getElementById('pl1').onclick = ()=>swap('藕香榭','pl1','pl2');
  document.getElementById('pl2').onclick = ()=>swap('缀锦阁','pl2','pl1');
})();

/* ================================================================
   渲染循环
   ================================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // 水面微动
  if(world.userData.water){
    world.userData.water.position.y = -1.25 + Math.sin(t*0.6)*0.02;
  }
  // 灯笼摇曳
  lanternLights.forEach((l,i)=>{
    l.intensity = (state.night ? 1.15 : 0.7) + Math.sin(t*2.2 + i)*0.12;
  });
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 启动 */
animate();
setTimeout(()=>{
  const ld = document.getElementById('loading');
  ld.style.opacity = 0;
  setTimeout(()=>ld.remove(), 820);
  toast('拖拽旋转 · 点击座位查看考释');
}, 700);

})();
</script>
